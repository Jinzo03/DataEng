apiVersion: 1
datasources:
  - name: Warehouse
    uid: warehouse
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    isDefault: true
